<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hiking Trails</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    /* Basic styles for display */
    body {
      font-family: "Poppins", Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
      text-align: center;

      /* Added smooth fade animation */
      animation: fadeIn 1s ease-in;
    }

    /* Fade animation */
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    nav {
      background-color: #34495e;
      padding: 10px 0;
      position: sticky;
      top: 0;
      z-index: 1000;

      /* Navbar glow effect */
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;

      /* Smooth hover */
      transition: 0.3s;
    }

    nav a:hover {
      text-decoration: underline;
      color: #f1c40f;
      text-shadow: 0 0 10px #f1c40f;
    }

    .trail {
      border: 1px solid #ccc;
      padding: 10px;
      margin: 10px;
    }
    .trail img {
      max-width: 100%;
      height: auto;
    }
    footer {
      background-color: #2c3e50;
      color: white;
      padding: 20px 0;
      margin-top: 40px;
      box-shadow: 0 -3px 10px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <header style="background-color: light blue; padding: 20px 0;">
    <div style="text-align: center; color: white; background-color: #2c3e50; padding: 20px 5px;">
    <h1>Top Hiking Trails</h1>
    </div>
  </header>
  <nav style="background-color: #34495e; padding: 10px 20px; position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center;">
    <a href="javascript:history.back()" style="font-weight: bold;">Back to Home Page</a>
    <div style="display: flex; align-items: center;">
      <input type="text" id="searchInput" placeholder="Search trail..." style="padding: 5px;"/>
      <button id="searchButton" style="margin-left: 10px; padding: 5px;">Search</button>
    </div>
  </nav>
  <div id="wrapper"></div>
  <script src="scripts/trail.js"></script>
  <script src="scripts/search.js"></script>
  <footer>
    <p>&copy; 2025 Flagstaff Adventures. All rights reserved.</p>
  </footer>
</body>
</html>
