<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hiking Trails</title>
  <style>
    /* Basic styles for display */
    .trail {
      border: 1px solid #ccc;
      padding: 10px;
      margin: 10px;
    }
    .trail img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <header style="background-color: light blue; padding: 20px 0;">
    <div style="text-align: center; color: white; background-color: #2c3e50; padding: 20px 5px;">
    <h1>Top Hiking Trails</h1>
    </div>
  </header>
  <nav style="background-color: #34495e; padding: 10px 20px; position: sticky; top: 0; z-index: 1000; display: flex; justify-content: space-between; align-items: center;">
    <a href="javascript:history.back()" style="color: white; font-weight: bold; text-decoration: none;">Back to Home Page</a>
    <input type="text" id="searchInput" placeholder="Search trail..." style="margin-left: 20px; padding: 5px;"/>
    <button id="searchButton" style="margin-left: 10px; padding: 5px;">Search</button>
  </nav>
  <div id="wrapper"></div>
  <script src="scripts/trail.js"></script>
  <script src="scripts/search.js"></script>
</body>
</html>
