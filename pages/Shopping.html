<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shopping</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    /* Basic styles for display */
    body {
      font-family: "Poppins", Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f0f0f0;
      text-align: center;
      font-size: 16px; /* default font size */

      /* Added smooth fade animation */
      animation: fadeIn 1s ease-in;
    }

    /* Fade animation */
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Container to center content with max width */
    #wrapper {
      max-width: 1200px;
      margin: 0 auto;
      padding: 10px;
    }

    /* Styles for header */
    header {
      background-color: #2c3e50;
      padding: 20px 0;
    }

    header h1 {
      font-size: 4vw; /* scales with viewport width */
      margin: 0;
      color: white;
    }

    /* Navbar styles */
    nav {
      background-color: #34495e;
      padding: 10px 20px;
      position: sticky;
      top: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
      transition: 0.3s;
    }

    nav a:hover {
      text-decoration: underline;
      color: #f1c40f;
      text-shadow: 0 0 10px #f1c40f;
    }

    /* Trail item styles */
    .trail {
      border: 1px solid #ccc;
      padding: 10px;
      margin: 10px 0;
    }

    .trail img {
      max-width: 100%;
      height: auto;
    }

    /* Footer styles */
    footer {
      background-color: #2c3e50;
      color: white;
      padding: 20px 0;
      margin-top: 40px;
      box-shadow: 0 -3px 10px rgba(0,0,0,0.3);
    }

    /* Responsive adjustments for smaller screens */
    @media (max-width: 768px) {
      header h1 {
        font-size: 6vw;
      }

      body {
        font-size: 14px;
      }

      nav {
        flex-direction: column;
        align-items: stretch;
      }

      nav a {
        margin: 10px 0;
        font-size: 4vw;
      }

      #searchInput {
        width: 60%;
      }
    }
  </style>
</head>
<body>
  <header>
    <div style="text-align: center;">
      <h1>Top Shopping Spots</h1>
    </div>
  </header>
  <nav>
    <a href="javascript:history.back()" style="font-weight: bold;">Back to Home Page</a>
    <div style="display: flex; align-items: center;">
      <input type="text" id="searchInput" placeholder="Search shop..." style="padding: 5px;"/>
      <button id="searchButton" style="margin-left: 10px; padding: 5px;">Search</button>
    </div>
  </nav>
  <div id="wrapper"></div>
  <script src="scripts/shop-loader.js"></script>
  <script src="scripts/shop-search.js"></script>
  <footer>
    <p>&copy; 2025 Flagstaff Adventures. All rights reserved.</p>
  </footer>
</body>
</html>
