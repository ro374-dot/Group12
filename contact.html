<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Flagstaff Adventures</title>
    </head>
  <style>
  .contact-container {
    display: flex;
    width: 100%;
    margin: 0;
    padding: 0;
  }

  .contact-card {
    flex: 1;
    min width: 20%;
    background-color: #34495e;
    color: white;
    padding: 35px 20px;
    border-radius: 12px;
    text-align: center;
    border: 1px solid black;
    transition: transform 0.3s ease, background-color 0.3s ease;
    box-shadow: 0px 4px 12px rgba(0,0,0,0.3);
  }

  .contact-card:hover
    .contact-card h2,
    .contact-card p,
    .contact-card a{
      color:white;
      
  }

  .contact-card:hover {
    transform: translateY(-8px) scale(1.03);
    background-color: #2c3e50;
  }

  .contact-card a {
    color: #ffffff;
    font-weight: bold;
    text-decoration: none;
  }

  .contact-card a:hover {
    text-decoration: underline;
  }

  /* Responsive (mobile) */
  @media (max-width: 768px) {
    .contact-container {
      grid-template-columns: 1fr;
    }
  }
    
</style>
  
  <body>

  <header style="background-color: #2c3e50; padding: 20px 0;">
    <div style="text-align: center; color: white; background-color: #2c3e50; padding: 30px 5px;">
    <h1>Connect With Us!</h1>
    </div>
  </header>

  <nav style="background-color: #34495e; padding: 10px 0; position: sticky; top: 0; z-index: 1000;">
    <a href="index.html" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold;">Back to Home Page</a>
  </nav>

</body>

</html>
